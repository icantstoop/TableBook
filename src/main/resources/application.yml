spring.jpa.hibernate.ddl-auto: validate
spring:
  flyway:
    enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/TableBook
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    show-sql: false
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
